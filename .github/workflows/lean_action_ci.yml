name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Verify no sorry in source (proof-position only)
        run: |
          # Match only REAL proof-position `sorry` in Lean 4 syntax:
          #   `:= sorry` or `:=sorry` (term-mode proof)
          #   `by sorry` or `by\n  sorry` (tactic-mode proof, when sorry is the only tactic or terminator)
          #   bare `sorry` on its own line (often inside a `by` block)
          # Ignore docstring / comment / attackHistory mentions of "sorry" entirely
          # (these are NOT proof-position so they cannot affect kernel-purity).
          if grep -rnE ':=[[:space:]]*sorry\b|^[[:space:]]+sorry[[:space:]]*$|\bby[[:space:]]+sorry\b' HodgeReduction/ HodgeReduction.lean --include="*.lean"; then
            echo "ERROR: proof-position sorry found in source code"
            exit 1
          fi
          echo "OK: no proof-position sorry"
